<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/adifagbola_logo_transparent_tight.png" type="image/png" />
  <title>About | Adifagbola Traditional Healing Ltd</title>
  <meta name="description" content="Meet Babaláwo Dr. Faniyi Adebanjo Adifagbola and the House of Adifagbola tradition." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: { DEFAULT: '#14281c', light: '#1e3d2a', mid: '#2a5a3c', dark: '#0c1a12' },
            gold: { DEFAULT: '#e8c56a', light: '#f5e6b8', dark: '#c9a84a' },
            cream: { DEFAULT: '#f7f4ef', dark: '#ebe6dc' },
            ink: '#2c2418',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
  </style>
</head>
<body class="bg-cream text-ink min-h-screen flex flex-col antialiased">
  <header class="sticky top-0 z-50 bg-[#f7f4ef] text-forest border-b border-[#ebe6dc]">
    <div class="max-w-6xl mx-auto px-5 sm:px-6 lg:px-8">
      <div class="relative flex items-center justify-between h-16">
        <a href="index.html" class="relative z-10 flex items-center gap-3 group shrink-0" aria-label="Home">
          <img src="images/adifagbola_logo_transparent_tight.png" alt="Adifagbola" class="h-12 w-auto object-contain" />
        </a>
        <nav class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 items-center gap-8">
          <a href="index.html" class="text-forest hover:text-forest-mid text-sm font-medium transition-colors">Home</a>
          <a href="services.html" class="text-forest hover:text-forest-mid text-sm font-medium transition-colors">Services</a>
          <a href="about.html" class="text-forest-mid text-sm font-semibold">About</a>
          <a href="contact.html" class="text-forest hover:text-forest-mid text-sm font-medium transition-colors">Contact</a>
        </nav>
        <div class="relative z-10 flex items-center gap-3 shrink-0">
          <a href="contact.html" class="hidden md:inline-flex px-5 py-2 bg-forest text-cream text-sm font-semibold rounded-full hover:bg-forest-light transition-colors">Book Ifá Consultation</a>
          <button id="menu-btn" class="md:hidden p-2 text-forest" aria-label="Menu">
            <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="5" y2="5"/><line x1="4" x2="20" y1="19" y2="19"/></svg>
            <svg id="close-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6 18 18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-[#f7f4ef] border-t border-[#ebe6dc]">
      <nav class="px-5 py-4 space-y-1">
        <a href="index.html" class="block px-4 py-3 text-forest hover:bg-white rounded-lg text-sm">Home</a>
        <a href="services.html" class="block px-4 py-3 text-forest hover:bg-white rounded-lg text-sm">Services</a>
        <a href="about.html" class="block px-4 py-3 text-forest bg-white rounded-lg text-sm font-semibold">About</a>
        <a href="contact.html" class="block px-4 py-3 text-forest hover:bg-white rounded-lg text-sm">Contact</a>
        <a href="contact.html" class="block mt-3 px-4 py-3 bg-forest text-cream text-center font-semibold rounded-lg text-sm">Book Ifá Consultation</a>
      </nav>
    </div>
  </header>
  <main class="flex-grow">
    <p class="p-10 text-center text-ink/50">Loading full About content from repository history…</p>
  </main>
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');
    const closeIcon = document.getElementById('close-icon');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      menuIcon.classList.toggle('hidden');
      closeIcon.classList.toggle('hidden');
    });
  </script>
</body>
</html>
